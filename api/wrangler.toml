# Cloudflare Worker for C.Sole visit tracking
name = "csole-tracker"
main = "worker.js"
compatibility_date = "2025-01-01"

# KV namespace for storing visit records
# Run: npx wrangler kv:namespace create "VISITS"
# Then paste the ID below:
# kv_namespaces = [
#   { binding = "VISITS", id = "YOUR_KV_ID" }
# ]

# Secrets (set via: npx wrangler secret put ADMIN_PASSWORD)
# ADMIN_PASSWORD = your-admin-password
# WECHAT_APP_ID = your-wechat-app-id (optional)
# WECHAT_APP_SECRET = your-wechat-app-secret (optional)
