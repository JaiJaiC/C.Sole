<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>C.Sole — Visit Log</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d; --surface: #1a1a1a; --elevated: #242424;
      --accent: #e8a850; --accent-dim: rgba(232,168,80,0.12);
      --text: #f0f0f0; --text-dim: #a0a0a0; --text-muted: #666;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-weight: 300; line-height: 1.6; -webkit-font-smoothing: antialiased;
      padding: 2rem;
    }
    .container { max-width: 1100px; margin: 0 auto; }

    /* ─── Gate ─── */
    .gate {
      display: flex; justify-content: center; align-items: center;
      min-height: 60vh;
    }
    .gate-box {
      text-align: center; max-width: 320px; width: 100%;
    }
    .gate-box svg { color: var(--text-dim); opacity: 0.6; margin-bottom: 1rem; }
    .gate-box p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 1rem; }
    .gate-box input {
      width: 100%; padding: 10px 16px; background: var(--surface);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      color: var(--text); font-size: 1rem; text-align: center;
      letter-spacing: 0.2em; outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .gate-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .gate-error { color: #e05555; font-size: 0.82rem; margin-top: 0.5rem; opacity: 0; }
    .gate-error.show { opacity: 1; }

    /* ─── Dashboard ─── */
    .hidden { display: none !important; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;
      padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.6rem; color: var(--accent); font-weight: 600; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn {
      padding: 8px 18px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
      background: var(--surface); color: var(--text-dim); cursor: pointer;
      font-size: 0.85rem; transition: all 0.15s;
    }
    .btn:hover { background: var(--elevated); color: var(--text); }
    .btn-accent { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

    /* ─── Stats ─── */
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 2rem; }
    .stat-card {
      flex: 1; min-width: 140px; background: var(--surface);
      border: 1px solid rgba(255,255,255,0.05); border-radius: 10px;
      padding: 1.2rem 1.5rem; text-align: center;
    }
    .stat-num { font-size: 2rem; font-weight: 600; color: var(--accent); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }

    /* ─── Table ─── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: nowrap; }
    th { color: var(--text-muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; position: sticky; top: 0; background: var(--bg); }
    td { color: var(--text-dim); }
    td .wx-badge { display: inline-block; background: #07c16020; color: #07c160; padding: 1px 8px; border-radius: 10px; font-size: 0.72rem; }
    td .avatar { width: 26px; height: 26px; border-radius: 50%; vertical-align: middle; margin-right: 6px; object-fit: cover; }
    .nick { color: var(--text); }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      .stats { gap: 10px; }
      .stat-card { padding: 1rem; min-width: 100px; }
      .stat-num { font-size: 1.5rem; }
      th, td { padding: 8px 6px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<!-- ─── Password Gate ─── -->
<div class="gate" id="gate">
  <div class="gate-box">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      <circle cx="12" cy="16" r="1"/>
    </svg>
    <p>Admin access</p>
    <input type="password" id="admin-pwd" placeholder="Password…" maxlength="30" autocomplete="off">
    <p class="gate-error" id="gate-error">Incorrect password</p>
  </div>
</div>

<!-- ─── Dashboard ─── -->
<div class="container hidden" id="dashboard">
  <div class="header">
    <h1>Visit Log</h1>
    <div class="header-actions">
      <span style="font-size:0.8rem;color:var(--text-muted)" id="last-refresh"></span>
      <button class="btn" id="btn-refresh">Refresh</button>
      <button class="btn btn-accent" id="btn-owner">Set as Owner</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Source</th>
          <th>User</th>
          <th>From</th>
          <th>Location</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ─── CONFIG ─────────────────────────────────────────────
  var API_BASE = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';
  // ^^^ Replace with your Apps Script URL from step 5

  var gate       = document.getElementById('gate');
  var gateError  = document.getElementById('gate-error');
  var pwdInput   = document.getElementById('admin-pwd');
  var dashboard  = document.getElementById('dashboard');
  var statsEl    = document.getElementById('stats');
  var rowsEl     = document.getElementById('rows');
  var lastRefEl  = document.getElementById('last-refresh');
  var btnRefresh = document.getElementById('btn-refresh');
  var btnOwner   = document.getElementById('btn-owner');

  var adminPwd = '';

  // ─── Password gate ──────────────────────────────────────
  pwdInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) {
      e.preventDefault();
      adminPwd = pwdInput.value;
      fetchVisits();
    }
  });
  pwdInput.addEventListener('input', function () {
    gateError.classList.remove('show');
  });

  function fetchVisits() {
    fetch(API_BASE + '?action=visits&pwd=' + encodeURIComponent(adminPwd))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) {
          gateError.classList.add('show');
          pwdInput.value = '';
          return;
        }
        gate.classList.add('hidden');
        dashboard.classList.remove('hidden');
        render(data);
      })
      .catch(function () {
        gateError.classList.add('show');
      });
  }

  // ─── Render ─────────────────────────────────────────────
  function render(visits) {
    var now = new Date();
    lastRefEl.textContent = 'Updated ' + now.toLocaleTimeString('zh-CN');

    // Stats
    var total = visits.length;
    var uniqueMap = {};
    var wxCount = 0;
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var todayCount = 0;

    visits.forEach(function (v) {
      uniqueMap[v.vid] = true;
      if (v.isWeChat) wxCount++;
      if (v.timestamp >= todayStart) todayCount++;
    });

    statsEl.innerHTML = [
      { n: total,     l: 'Total Visits' },
      { n: Object.keys(uniqueMap).length, l: 'Unique Visitors' },
      { n: todayCount, l: 'Today' },
      { n: wxCount,   l: 'From WeChat' },
    ].map(function (s) {
      return '<div class="stat-card"><div class="stat-num">' + s.n + '</div><div class="stat-label">' + s.l + '</div></div>';
    }).join('');

    // Table — newest first
    var reversed = visits.slice().reverse();
    rowsEl.innerHTML = reversed.map(function (v) {
      var time = new Date(v.timestamp).toLocaleString('zh-CN');
      var source = v.isWeChat ? '<span class="wx-badge">WeChat</span>' : 'Web';
      var user = '';
      if (v.wxAvatar) user += '<img class="avatar" src="' + escapeHtml(v.wxAvatar) + '" alt="" loading="lazy">';
      if (v.wxNick) user += '<span class="nick">' + escapeHtml(v.wxNick) + '</span>';
      if (!user) user = '<span style="color:var(--text-muted)">—</span>';
      var from = v.referrer ? (v.referrer.length > 40 ? v.referrer.substring(0, 40) + '…' : v.referrer) : 'Direct';
      var loc = [v.country, v.city].filter(Boolean).join(', ') || '—';
      return '<tr>' +
        '<td>' + time + '</td>' +
        '<td>' + source + '</td>' +
        '<td>' + user + '</td>' +
        '<td title="' + escapeHtml(v.referrer || '') + '">' + escapeHtml(from) + '</td>' +
        '<td>' + escapeHtml(loc) + '</td>' +
        '</tr>';
    }).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ─── Buttons ────────────────────────────────────────────
  btnRefresh.addEventListener('click', function () { fetchVisits(); });
  btnOwner.addEventListener('click', function () {
    document.cookie = 'csole_owner=1; path=/; max-age=' + (365 * 24 * 60 * 60) + '; SameSite=Lax';
    alert('Owner cookie set! Your visits will not be tracked. Valid for 1 year.');
  });
})();
</script>

</body>
</html>
