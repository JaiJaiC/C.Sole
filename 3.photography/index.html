<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/theme-init.js?v=1"></script>
    <title>Photography · C.Sole</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet"></noscript>
    <link rel="icon" type="image/jpeg" href="../logo/我的自画像.jpg">
    <script src="../js/favicon.js" defer></script>
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="../css/settings.css?v=1">
</head>
<body class="has-nav">

    <!-- ─── Top Navigation ─── -->
    <nav class="site-nav" aria-label="Main navigation">
        <a href="https://jaijaic.site/C/" class="nav-logo"><img src="../logo/我的自画像.jpg" alt="C.Sole" class="nav-logo-img"></a>
        <ul class="nav-links">
            <li class="nav-dropdown">
                <a href="../">Music</a>
                <ul class="nav-submenu">
                    <li><a href="https://jaijaic.site/ServoPiaBot/" target="_blank" rel="noopener">ServoPiaBot</a></li>
                </ul>
            </li>
            <li><a href="../2.draw/">Draw</a></li>
            <li class="nav-dropdown">
                <a href="./" class="nav-active">Photography</a>
                <ul class="nav-submenu">
                    <li><a href="./">Landscape</a></li>
                    <li><a href="./#section-portrait">Portrait</a></li>
                </ul>
            </li>
            <li><a href="../4.3D%20modeling/">Modeling</a></li>
            <li><a href="../5.thinking/">Thinking</a></li>
        </ul>
    </nav>

    <!-- Hero -->
    <header class="hero">
        <h1 class="hero-title">Photography</h1>
        <p class="hero-subtitle">Landscapes &amp; Moments</p>
        <div class="hero-line"></div>
    </header>

    <!-- Landscape Section -->
    <section class="portfolio-section" id="section-landscape">
        <h2 class="section-title">Landscape</h2>
        <div class="masonry" id="gallery-landscape"></div>
    </section>

    <!-- Portrait Section (Password Protected) -->
    <section class="portfolio-section" id="section-portrait">
        <h2 class="section-title">Portrait</h2>
        <div class="portrait-gate" id="portrait-gate">
            <div class="portrait-gate-inner">
                <svg class="portrait-lock-icon" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    <circle cx="12" cy="16" r="1"/>
                </svg>
                <p class="portrait-gate-text">Enter password to view portraits</p>
                <input type="password" class="portrait-gate-input" id="portrait-password" placeholder="Password…" maxlength="20" autocomplete="off">
                <p class="portrait-gate-error" id="portrait-error">Incorrect password</p>
            </div>
        </div>
        <div class="masonry" id="gallery-portrait" style="visibility:hidden;">
            <div class="img-card" data-index="0" data-src="portrait/1.jpg" data-thumb="thumbs/portrait/1.webp"><img class="gallery-img" loading="lazy" decoding="async" alt="Portrait 1"></div>
            <div class="img-card" data-index="1" data-src="portrait/2.JPG" data-thumb="thumbs/portrait/2.webp"><img class="gallery-img" loading="lazy" decoding="async" alt="Portrait 2"></div>
            <div class="img-card" data-index="2" data-src="portrait/3.JPG" data-thumb="thumbs/portrait/3.webp"><img class="gallery-img" loading="lazy" decoding="async" alt="Portrait 3"></div>
            <div class="img-card" data-index="3" data-src="portrait/4.JPG" data-thumb="thumbs/portrait/4.webp"><img class="gallery-img" loading="lazy" decoding="async" alt="Portrait 4"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 C.Sole. All rights reserved.</p>
    </footer>

    <!-- Fullscreen Lightbox -->
    <div id="lightbox" class="lightbox">
        <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
        <button id="lightbox-prev" class="lightbox-arrow lightbox-prev" aria-label="Previous">&lsaquo;</button>
        <img id="lightbox-img" src="" alt="">
        <button id="lightbox-next" class="lightbox-arrow lightbox-next" aria-label="Next">&rsaquo;</button>
        <div id="lightbox-counter" class="lightbox-counter"></div>
    </div>

    <script src="script.js?v=5" defer></script>
    <script src="../js/settings.js?v=1" defer></script>
</body>
</html>
